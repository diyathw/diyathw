<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">diyathw.com favicon</title>
  <desc id="desc">The Diyath Wickramaratne portfolio mark: a white D and cyan terminal prompt on a dark rounded square.</desc>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0B1220"/>

  <!-- Bold geometric D; the cutout is part of the path, so no font is required. -->
  <path
    fill="#F8FAFC"
    fill-rule="evenodd"
    d="M12 11h12c10.5 0 17 8.4 17 21s-6.5 21-17 21H12V11Zm9 8v26h3c5.5 0 8-4.6 8-13s-2.5-13-8-13h-3Z"
  />

  <!-- Terminal/code prompt accent -->
  <path
    d="m44 24 8 8-8 8"
    fill="none"
    stroke="#22D3EE"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
